<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="随机转盘 by lingyicute">
<title>随机转盘</title>
<style>
  /* ============================= 基础 ============================= */
  :root{
    --bg:#060913;
    --ink:#eef1f8;
    --muted:#8b93a7;
    --line:rgba(255,255,255,.08);
    --panel:rgba(255,255,255,.045);
    --gold:#f6c453;
    --gold2:#ffdf8e;
    --violet:#7c5cff;
    --teal:#2fe0c0;
    --danger:#ff5d73;
    --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 82% -10%, rgba(124,92,255,.16), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(246,196,83,.10), transparent 55%),
      var(--bg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 背景装饰光斑 */
  .blob{ position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; pointer-events:none; z-index:0; animation:drift 18s ease-in-out infinite alternate; }
  .blob.b1{ width:520px; height:520px; left:-160px; top:-180px; background:radial-gradient(circle,#281a6e,transparent 70%); }
  .blob.b2{ width:460px; height:460px; right:-140px; bottom:-160px; background:radial-gradient(circle,#5e3d0b,transparent 70%); animation-delay:-9s; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(40px,30px) scale(1.08);} }

  /* ============================= 布局 ============================= */
  #app{ position:relative; z-index:1; display:flex; height:100vh; }

  /* 左侧面板 */
  .panel{
    width:380px; flex:0 0 380px; height:100%;
    padding:22px 18px 18px;
    display:flex; flex-direction:column; gap:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border-right:1px solid var(--line);
    backdrop-filter:blur(14px);
    animation:slideL .6s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes slideL{ from{ opacity:0; transform:translateX(-24px);} to{ opacity:1; transform:none;} }

  .brand{ display:flex; align-items:center; gap:12px; padding:0 4px; }
  .brand svg{ width:30px; height:30px; color:var(--gold); flex:0 0 auto; }
  .brand h1{
    font-size:22px; font-weight:800; letter-spacing:.06em;
    background:linear-gradient(92deg,#ffd770,#ff9f6e 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand small{ display:block; font-size:10px; letter-spacing:.32em; color:var(--muted); margin-top:3px; font-weight:600; }

  /* 添加行 */
  .add-row{ display:flex; gap:8px; }
  .add-row input{
    flex:1; height:42px; padding:0 14px;
    background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px;
    color:var(--ink); font:inherit; font-size:14px; outline:none; transition:.2s;
  }
  .add-row input::placeholder{ color:#5d6577; }
  .add-row input:focus{ border-color:rgba(246,196,83,.55); background:rgba(246,196,83,.06); box-shadow:0 0 0 3px rgba(246,196,83,.12); }

  .btn-gold{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer; font:inherit; font-weight:800; letter-spacing:.05em;
    color:#3a2503; border-radius:12px;
    background:linear-gradient(180deg,#ffe08a,#f6c453 55%,#e8a92c);
    box-shadow:0 6px 18px rgba(246,196,83,.28), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 5px rgba(150,90,0,.35);
    transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .btn-gold:hover{ transform:translateY(-1px); filter:brightness(1.05); box-shadow:0 10px 24px rgba(246,196,83,.34), inset 0 1px 0 rgba(255,255,255,.65); }
  .btn-gold:active{ transform:translateY(1px) scale(.98); }

  #addBtn{ width:46px; height:42px; flex:0 0 auto; font-size:18px; }

  /* 工具行 */
  .tools{ display:flex; align-items:center; gap:6px; padding:0 2px; }
  .count{
    font-size:12px; color:var(--muted); letter-spacing:.06em;
    background:rgba(255,255,255,.05); border:1px solid var(--line);
    padding:5px 12px; border-radius:99px; font-weight:700;
  }
  .tools .spacer{ flex:1; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid transparent;
    background:transparent; color:var(--muted); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; transition:.18s;
  }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn:hover{ color:#fff; background:rgba(255,255,255,.08); }
  .icon-btn.arming{ color:var(--danger); background:rgba(255,93,115,.14); border-color:rgba(255,93,115,.4); animation:pulseWarn 1s infinite; }
  @keyframes pulseWarn{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,93,115,.35);} 50%{ box-shadow:0 0 0 5px rgba(255,93,115,0);} }
  .btn-ghost{
    display:inline-flex; align-items:center; gap:6px;
    height:34px; padding:0 12px; font:inherit; font-size:12px; font-weight:700; letter-spacing:.04em;
    color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:.18s;
  }
  .btn-ghost svg{ width:15px; height:15px; }
  .btn-ghost:hover{ color:#fff; border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.06); }

  /* 列表 */
  #itemList{ flex:1; min-height:0; overflow-y:auto; list-style:none; display:flex; flex-direction:column; gap:8px; padding:2px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; }
  #itemList::-webkit-scrollbar{ width:5px; }
  #itemList::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); border-radius:99px; }
  #itemList li{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.05);
    border-radius:12px; transition:background .18s, transform .18s, border-color .18s;
    animation:rowIn .35s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rowIn{ from{ opacity:0; transform:translateY(8px) scale(.98);} to{ opacity:1; transform:none;} }
  #itemList li:hover{ background:rgba(255,255,255,.07); border-color:rgba(246,196,83,.35); transform:translateX(3px); }
  #itemList li.lastwin{ background:linear-gradient(90deg, rgba(246,196,83,.16), rgba(246,196,83,.04)); border-color:rgba(246,196,83,.6); box-shadow:0 0 18px rgba(246,196,83,.18); }
  .dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 8px currentColor; }
  .idx{ font-size:10px; color:var(--muted); width:20px; text-align:right; flex:0 0 auto; font-weight:700; font-variant-numeric:tabular-nums; }
  .name{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; font-weight:600; }
  .row-actions{ display:flex; gap:2px; opacity:0; transition:.18s; }
  #itemList li:hover .row-actions{ opacity:1; }
  .row-actions .icon-btn{ width:28px; height:28px; border-radius:8px; }
  .row-actions .icon-btn.del:hover{ color:var(--danger); background:rgba(255,93,115,.12); }
  .edit-input{ flex:1; min-width:0; background:rgba(0,0,0,.3); border:1px solid rgba(246,196,83,.5); border-radius:8px; color:#fff; font:inherit; font-size:14px; padding:4px 8px; outline:none; }
  li.empty-row{ justify-content:center; color:var(--muted); font-size:13px; border-style:dashed; padding:22px 12px; text-align:center; line-height:1.8; }

  /* 底部设置 */
  .panel-foot{ display:flex; align-items:center; gap:8px; padding-top:2px; border-top:1px solid var(--line); padding:12px 2px 0; }
  .panel-foot label{ font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.04em; }
  .panel-foot input[type=range]{ flex:1; min-width:60px; accent-color:var(--gold); cursor:pointer; height:14px; }
  .panel-foot .val{ font-size:12px; color:var(--gold); font-weight:800; width:30px; font-variant-numeric:tabular-nums; }

  /* ============================= 转盘舞台 ============================= */
  .stage{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; padding:28px; animation:fadeUp .7s .1s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(18px);} to{ opacity:1; transform:none;} }

  .wheel-wrap{
    position:relative;
    width:min(calc(100vh - 110px), calc(100vw - 500px), 760px);
    aspect-ratio:1/1;
    filter:drop-shadow(0 30px 50px rgba(0,0,0,.55));
    transition:filter .5s;
  }
  body.spinning .wheel-wrap{ filter:drop-shadow(0 0 46px rgba(246,196,83,.30)) drop-shadow(0 30px 50px rgba(0,0,0,.55)); }
  #wheel{ width:100%; height:100%; display:block; }

  /* 指针 */
  .pointer{
    position:absolute; left:50%; top:-14px; translate:-50% 0; z-index:5;
    width:52px; height:64px;
    transform-origin:50% 10px;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));
  }
  .pointer .pin{
    width:100%; height:100%;
    clip-path:polygon(50% 100%, 88% 46%, 76% 10%, 24% 10%, 12% 46%);
    background:linear-gradient(180deg,#fff,#ffe9b0 30%,#f6c453 55%,#e0742a);
  }
  .pointer .stud{
    position:absolute; left:50%; top:8px; translate:-50% 0; width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #f6c453 45%, #8a5a00);
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .pointer.wiggle{ animation:wiggle .12s ease; }
  @keyframes wiggle{ 0%{ transform:rotate(0);} 35%{ transform:rotate(13deg);} 100%{ transform:rotate(0);} }

  /* 中心按钮 */
  #spinBtn{
    position:absolute; left:50%; top:50%; translate:-50% -50%; z-index:4;
    width:clamp(96px, 23%, 150px); aspect-ratio:1/1; border-radius:50%;
    border:5px solid rgba(255,255,255,.85); cursor:pointer;
    font-family:var(--font); font-weight:900; color:#432603;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    background:radial-gradient(circle at 32% 26%, #ffffff 0%, #ffeab3 14%, #f6c453 46%, #e79c1f 76%, #a8650a 100%);
    box-shadow:0 12px 30px rgba(0,0,0,.5), inset 0 3px 8px rgba(255,255,255,.75), inset 0 -12px 20px rgba(130,70,0,.45);
    transition:transform .16s, box-shadow .2s, filter .2s;
  }
  #spinBtn .t1{ font-size:1.35em; letter-spacing:.14em; line-height:1.1; text-indent:.14em; }
  #spinBtn .t2{ font-size:.62em; letter-spacing:.34em; text-indent:.34em; opacity:.65; font-weight:800; margin-top:2px; }
  #spinBtn:hover:not(.off):not(.busy){ transform:scale(1.05); box-shadow:0 16px 36px rgba(0,0,0,.55), 0 0 30px rgba(246,196,83,.35), inset 0 3px 8px rgba(255,255,255,.75), inset 0 -12px 20px rgba(130,70,0,.45); }
  #spinBtn:active:not(.off):not(.busy){ transform:scale(.95); }
  #spinBtn.busy{ pointer-events:none; animation:hubPulse 1.2s ease-in-out infinite; }
  @keyframes hubPulse{ 0%,100%{ box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 0 0 rgba(246,196,83,.5), inset 0 3px 8px rgba(255,255,255,.75), inset 0 -12px 20px rgba(130,70,0,.45);} 50%{ box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 34px 8px rgba(246,196,83,.35), inset 0 3px 8px rgba(255,255,255,.75), inset 0 -12px 20px rgba(130,70,0,.45);} }
  #spinBtn.off{ filter:grayscale(.85) brightness(.6); cursor:not-allowed; }

  .stage .hint{ position:absolute; bottom:26px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted); letter-spacing:.18em; pointer-events:none; animation:hintBlink 2.6s ease-in-out infinite; }
  @keyframes hintBlink{ 0%,100%{ opacity:.5;} 50%{ opacity:1;} }

  /* ============================= 弹层（通用） ============================= */
  .overlay{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%, rgba(26,20,52,.92), rgba(4,6,13,.95));
    backdrop-filter:blur(10px);
    opacity:1; transition:opacity .35s;
  }
  .overlay.hidden{ opacity:0; pointer-events:none; }

  /* 中奖弹层 */
  .win-card{ position:relative; z-index:1; text-align:center; padding:20px; max-width:92vw; }
  .win-badge{ width:46px; height:46px; color:var(--gold); margin:0 auto 10px; animation:trophyBounce 1.4s ease-in-out infinite; filter:drop-shadow(0 4px 14px rgba(246,196,83,.5)); }
  @keyframes trophyBounce{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-10px) rotate(4deg);} }
  .win-label{ font-size:13px; letter-spacing:.5em; text-indent:.5em; color:var(--gold); font-weight:800; animation:fadeIn .5s .1s both; }
  .win-name{
    margin:14px auto 8px; max-width:88vw; overflow-wrap:break-word;
    font-size:clamp(56px, 9.5vw, 150px); font-weight:900; letter-spacing:.04em; line-height:1.15;
    background:linear-gradient(94deg,#fff 5%, #ffe9a8 40%, #ffb35c 75%, #ff7eb0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 10px 34px rgba(246,196,83,.28));
    animation:namePop .7s .15s cubic-bezier(.2,1.5,.32,1) both;
  }
  @keyframes namePop{ 0%{ opacity:0; transform:scale(.4) translateY(40px);} 100%{ opacity:1; transform:none;} }
  @keyframes fadeIn{ from{ opacity:0;} to{ opacity:1;} }
  .win-sub{ font-size:13px; color:var(--muted); letter-spacing:.1em; animation:fadeIn .6s .4s both; }
  .win-actions{ display:flex; gap:12px; justify-content:center; margin-top:34px; animation:fadeIn .6s .5s both; flex-wrap:wrap; }
  .win-actions .btn-gold{ height:48px; padding:0 30px; font-size:15px; border-radius:14px; }
  .win-actions .btn-ghost{ height:48px; padding:0 22px; font-size:13px; border-radius:14px; }
  .btn-ghost.red{ color:var(--danger); border-color:rgba(255,93,115,.4); }
  .btn-ghost.red:hover{ background:rgba(255,93,115,.12); border-color:var(--danger); color:#ff8fa0; }

  /* 批量导入弹层 */
  .modal-card{
    width:min(560px, 92vw);
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:26px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:modalPop .35s cubic-bezier(.2,1.2,.3,1) both;
  }
  @keyframes modalPop{ from{ opacity:0; transform:translateY(18px) scale(.96);} to{ opacity:1; transform:none;} }
  .modal-card h3{ font-size:17px; letter-spacing:.06em; margin-bottom:4px; }
  .modal-card p{ font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.7; }
  .modal-card textarea{
    width:100%; height:190px; resize:vertical; padding:14px;
    background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:12px;
    color:var(--ink); font:inherit; font-size:13px; line-height:1.9; outline:none; transition:.2s;
    scrollbar-width:thin;
  }
  .modal-card textarea:focus{ border-color:rgba(246,196,83,.5); box-shadow:0 0 0 3px rgba(246,196,83,.1); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
  .modal-actions .btn-gold{ height:38px; padding:0 22px; font-size:13px; }
  .modal-actions .btn-ghost{ height:38px; padding:0 18px; }

  /* Toast */
  #toast{ position:fixed; bottom:28px; left:50%; translate:-50% 0; z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast-item{
    padding:10px 20px; border-radius:99px; font-size:13px; font-weight:700; letter-spacing:.03em;
    background:rgba(20,24,38,.92); border:1px solid rgba(255,255,255,.14); color:#fff;
    box-shadow:0 10px 28px rgba(0,0,0,.45); backdrop-filter:blur(8px);
    animation:toastIn .3s cubic-bezier(.2,1.2,.3,1) both;
  }
  .toast-item.err{ border-color:rgba(255,93,115,.5); color:#ff9fae; }
  .toast-item.ok{ border-color:rgba(47,224,192,.5); color:#7ef3dc; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(14px) scale(.9);} to{ opacity:1; transform:none;} }
  .toast-item.out{ transition:.3s; opacity:0; transform:translateY(8px); }

  /* ============================= 响应式（竖屏兜底） ============================= */
  @media (max-width:900px), (orientation:portrait){
    body{ overflow:auto; }
    #app{ flex-direction:column; height:auto; min-height:100vh; }
    .panel{ width:100%; flex:none; order:2; height:auto; border-right:none; border-top:1px solid var(--line); animation:none; }
    #itemList{ max-height:38vh; }
    .stage{ order:1; min-height:70vh; padding:18px; }
    .wheel-wrap{ width:min(calc(100vw - 52px), 64vh, 640px); }
    .stage .hint{ position:static; margin-top:18px; }
    .stage{ flex-direction:column; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div id="app">
    <!-- ============ 左侧：待选项面板 ============ -->
    <aside class="panel">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l1.9 5.3L19.5 10l-5.6 1.7L12 17l-1.9-5.3L4.5 10l5.6-1.7L12 3z"/></svg>
        <div>
          <h1>随机转盘</h1>
          <small>RANDOM WHEEL</small>
        </div>
      </div>

      <div class="add-row">
        <input id="addInput" type="text" placeholder="输入选项，回车添加（也支持逗号分隔）" maxlength="24" autocomplete="off" />
        <button id="addBtn" class="btn-gold" aria-label="添加">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" width="18" height="18"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="tools">
        <span class="count" id="countChip">共 0 项</span>
        <span class="spacer"></span>
        <button id="bulkBtn" class="btn-ghost" title="批量导入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg>
          批量导入
        </button>
        <button id="shuffleBtn" class="icon-btn" title="打乱顺序">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
        </button>
        <button id="clearBtn" class="icon-btn" title="清空全部">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>

      <ul id="itemList"></ul>

      <div class="panel-foot">
        <label for="durRange">时长</label>
        <input id="durRange" type="range" min="3" max="10" step="0.5" value="6" />
        <span class="val" id="durVal">6s</span>
        <button id="soundBtn" class="icon-btn" title="音效开关"></button>
        <button id="fsBtn" class="icon-btn" title="全屏显示">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </aside>

    <!-- ============ 右侧：转盘舞台 ============ -->
    <main class="stage">
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheel"></canvas>
        <div class="pointer" id="pointer"><div class="pin"></div><div class="stud"></div></div>
        <button id="spinBtn" class="off"><span class="t1">开始</span><span class="t2">GO</span></button>
      </div>
      <p class="hint">点击中心按钮 或 按空格键 随机选取一个选项 · 在列表悬停可高亮对应扇区</p>
    </main>
  </div>

  <!-- ============ 中奖全屏弹层 ============ -->
  <div class="overlay hidden" id="winOverlay">
    <div class="win-card">
      <svg class="win-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.3 12.2 2.5 2.5 4.9-5.4"/></svg>
      <div class="win-label">本轮结果 · RESULT</div>
      <div class="win-name" id="winName">—</div>
      <div class="win-sub" id="winSub"></div>
      <div class="win-actions">
        <button id="againBtn" class="btn-gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          再抽一次
        </button>
        <button id="removeWinBtn" class="btn-ghost red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          移出此项
        </button>
        <button id="closeWinBtn" class="btn-ghost">关闭</button>
      </div>
    </div>
  </div>

  <!-- ============ 批量导入弹层 ============ -->
  <div class="overlay hidden" id="bulkOverlay">
    <div class="modal-card">
      <h3>批量导入选项</h3>
      <p>每行一个，或用「逗号 / 顿号」分隔。自动去除空白与重复项，最多支持 100 项（数量较多时转盘会自动缩小字号）。</p>
      <textarea id="bulkText" placeholder="例如：北京，西安，成都，杭州，大理"></textarea>
      <div class="modal-actions">
        <button id="bulkCancel" class="btn-ghost">取消</button>
        <button id="bulkOk" class="btn-gold">导入</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
(function(){
  'use strict';
  const TAU = Math.PI * 2;
  const $ = s => document.querySelector(s);

  /* ================= 状态 ================= */
  let items = [];                // 待选项
  let rotation = 0;              // 当前转盘角度（弧度）
  let spinning = false;
  let hoverIdx = -1;             // 悬停高亮的扇区
  let lastWin = -1;              // 上次中奖索引（列表高亮）
  let duration = 6;              // 旋转时长（秒）
  let muted = false;
  const MAX_ITEMS = 100;

  /* ================= DOM ================= */
  const canvas = $('#wheel'), ctx = canvas.getContext('2d');
  const wrap = $('#wheelWrap');
  const spinBtn = $('#spinBtn');
  const pointer = $('#pointer');
  const addInput = $('#addInput');
  const itemList = $('#itemList');
  const countChip = $('#countChip');
  const winOverlay = $('#winOverlay'), winName = $('#winName'), winSub = $('#winSub');
  const bulkOverlay = $('#bulkOverlay'), bulkText = $('#bulkText');
  const pointerEl = pointer;

  /* ================= 存储 ================= */
  function save(){
    try{
      localStorage.setItem('lw_items', JSON.stringify(items));
      localStorage.setItem('lw_muted', muted ? '1' : '0');
      localStorage.setItem('lw_dur', String(duration));
    }catch(e){}
  }
  function load(){
    try{
      const a = JSON.parse(localStorage.getItem('lw_items') || '[]');
      if(Array.isArray(a)) items = a.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()).slice(0, MAX_ITEMS);
      muted = localStorage.getItem('lw_muted') === '1';
      const d = parseFloat(localStorage.getItem('lw_dur'));
      if(!isNaN(d)) duration = Math.min(10, Math.max(3, d));
    }catch(e){}
  }

  /* ================= 工具 ================= */
  const norm = a => ((a % TAU) + TAU) % TAU;
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

  function toast(msg, type){
    const box = $('#toast');
    while(box.children.length >= 3) box.firstChild.remove();
    const el = document.createElement('div');
    el.className = 'toast-item' + (type ? ' ' + type : '');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 320); }, 2200);
  }

  /* 黄金角配色：任意数量都能得到区分度良好的彩色转盘，且相邻两块深浅交错 */
  function segColor(i){
    const h = (i * 137.508 + 16) % 360;
    return { hue:h, fill:`hsl(${h} 74% ${i % 2 ? 61 : 50}%)` };
  }

  /* ================= 音效（WebAudio 原生实现） ================= */
  let AC = null;
  function audio(){ 
    if(muted) return null;
    try{
      if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if(AC.state === 'suspended') AC.resume();
      return AC;
    }catch(e){ return null; }
  }
  function beep(freq, dur, type, gain, delay){
    const c = audio(); if(!c) return;
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain || .04, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  const tickSound = () => beep(1500, .028, 'square', .022, 0);
  function winSound(){
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f,i)=> beep(f, .22, 'triangle', .09, i * .095));
  }

  /* ================= 列表渲染 ================= */
  const svgEdit = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
  const svgDel  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  function renderList(){
    itemList.innerHTML = '';
    if(items.length === 0){
      const li = document.createElement('li');
      li.className = 'empty-row';
      li.innerHTML = '暂无选项<br>在上方输入添加，或点击「批量导入」一次粘贴多条';
      itemList.appendChild(li);
    } else {
      items.forEach((text, i)=>{
        const li = document.createElement('li');
        li.dataset.idx = i;
        if(i === lastWin) li.classList.add('lastwin');
        const c = segColor(i);
        li.innerHTML =
          `<span class="idx">${String(i+1).padStart(2,'0')}</span>` +
          `<span class="dot" style="background:${c.fill}; color:${c.fill}"></span>` +
          `<span class="name" title="${escapeHtml(text)}">${escapeHtml(text)}</span>` +
          `<span class="row-actions">` +
            `<button class="icon-btn edit" title="编辑">${svgEdit}</button>` +
            `<button class="icon-btn del" title="删除">${svgDel}</button>` +
          `</span>`;
        itemList.appendChild(li);
      });
    }
    countChip.textContent = `共 ${items.length} 项`;
    spinBtn.classList.toggle('off', items.length < 2);
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  /* 解析一段输入（支持逗号/顿号/换行分隔） */
  function parseMulti(str){
    return str.split(/[\n,，、;；]+/).map(s => s.trim()).filter(Boolean);
  }
  function addItems(list){
    let added = 0, dup = 0;
    for(const t of list){
      const v = t.slice(0, 24);
      if(items.includes(v)){ dup++; continue; }
      if(items.length >= MAX_ITEMS){ toast(`最多 ${MAX_ITEMS} 项`, 'err'); break; }
      items.push(v); added++;
    }
    if(added) lastWin = -1;
    save(); renderList();
    if(added) toast(`已添加 ${added} 项`, 'ok');
    if(dup) toast(`${dup} 项重复，已跳过`);
  }

  /* ================= 转盘绘制 ================= */
  let cssSize = 0, R = 0, rimW = 0, F = 0;

  function fitCanvas(){
    const rect = wrap.getBoundingClientRect();
    cssSize = Math.max(180, Math.min(rect.width, rect.height || rect.width));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = cssSize / 2;
    rimW = clamp(cssSize * .032, 9, 22);
    F = R - rimW;
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('load', fitCanvas);

  function drawWheel(){
    ctx.clearRect(0, 0, cssSize, cssSize);
    ctx.save();
    ctx.translate(R, R);

    /* ---- 金属外圈 ---- */
    const rimGrad = ctx.createLinearGradient(-R, -R, R, R);
    rimGrad.addColorStop(0, '#ffe8ab');
    rimGrad.addColorStop(.35, '#b8860b');
    rimGrad.addColorStop(.55, '#fff3c9');
    rimGrad.addColorStop(.8, '#9c6b10');
    rimGrad.addColorStop(1, '#f3d27c');
    ctx.beginPath();
    ctx.arc(0, 0, R - rimW/2, 0, TAU);
    ctx.lineWidth = rimW;
    ctx.strokeStyle = rimGrad;
    ctx.stroke();

    /* ---- 外圈铆钉 ---- */
    const rivets = items.length >= 2 ? Math.min(items.length, 24) : 14;
    for(let i = 0; i < rivets; i++){
      const a = rotation * .5 + i * TAU / rivets;
      const rx = Math.cos(a) * (R - rimW/2), ry = Math.sin(a) * (R - rimW/2);
      ctx.beginPath();
      ctx.arc(rx, ry, rimW * .17, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.shadowColor = 'rgba(255,255,255,.8)'; ctx.shadowBlur = 4;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    const n = items.length;

    if(n === 0){
      /* ---- 空状态 ---- */
      ctx.beginPath();
      ctx.arc(0, 0, F * .96, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.03)';
      ctx.fill();
      ctx.setLineDash([10, 12]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,.28)';
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.font = '800 ' + clamp(cssSize * .045, 14, 22) + 'px "PingFang SC","Microsoft YaHei",system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('请先在左侧添加选项', 0, F * .45);
      ctx.restore();
      return;
    }

    const seg = TAU / n;

    /* ---- 填充扇区 ---- */
    for(let i = 0; i < n; i++){
      const a0 = rotation + i * seg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, F, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = segColor(i).fill;
      ctx.fill();
    }

    /* ---- 悬停高亮扇区 ---- */
    if(hoverIdx >= 0 && hoverIdx < n){
      const a0 = rotation + hoverIdx * seg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, F, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,240,200,.95)';
      ctx.stroke();
    }

    /* ---- 分隔线 ---- */
    ctx.lineWidth = n > 36 ? 1 : 1.8;
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    for(let i = 0; i < n; i++){
      const a = rotation + i * seg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * F, Math.sin(a) * F);
      ctx.stroke();
    }

    /* ---- 整体光泽罩 ---- */
    const gloss = ctx.createRadialGradient(0, 0, F * .15, 0, 0, F);
    gloss.addColorStop(0, 'rgba(255,255,255,.14)');
    gloss.addColorStop(.35, 'rgba(255,255,255,0)');
    gloss.addColorStop(.82, 'rgba(0,0,0,.10)');
    gloss.addColorStop(1, 'rgba(0,0,0,.30)');
    ctx.beginPath();
    ctx.arc(0, 0, F, 0, TAU);
    ctx.fillStyle = gloss;
    ctx.fill();

    /* ---- 文字（由中心向外展开，数量多时自动缩小） ---- */
    const fs = clamp(seg * F * .12, 10, 34);
    ctx.font = `700 ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.5)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 1;
    const hubR = (spinBtn.offsetWidth || 96) / 2 + 14;   // 避开中心按钮的实际半径，防止遮挡文字
    const x0 = Math.min(Math.max(hubR, F * .12), F * .45);
    const maxW = F * .93 - x0;
    for(let i = 0; i < n; i++){
      const mid = rotation + (i + .5) * seg;
      let label = items[i];
      if(ctx.measureText(label).width > maxW){
        while(label.length > 1 && ctx.measureText(label + '…').width > maxW) label = label.slice(0, -1);
        label += '…';
      }
      ctx.save();
      ctx.rotate(mid);
      ctx.fillText(label, x0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  /* ================= 指针命中计算 =================
     指针位于正上方（角度 -PI/2）。扇区 i 占据 [rotation+i*seg, rotation+(i+1)*seg) */
  function pointerIndex(){
    const n = items.length;
    if(!n) return -1;
    const seg = TAU / n;
    const a = norm(-Math.PI/2 - rotation);
    return Math.min(n - 1, Math.floor(a / seg));
  }

  const easeOutQuint = t => 1 - Math.pow(1 - t, 5);

  function spin(){
    if(spinning || !winOverlay.classList.contains('hidden')) return;
    const n = items.length;
    if(n < 2){ toast('至少添加 2 个选项才能开始', 'err'); return; }
    audio();
    spinning = true;
    hoverIdx = -1;
    lastWin = -1;
    renderList();
    document.body.classList.add('spinning');
    spinBtn.classList.add('busy');
    spinBtn.querySelector('.t1').textContent = '…';

    /* 随机决定中奖者，并把转盘精确停在该格中央 → 视觉结果与实际一致 */
    const seg = TAU / n;
    const winIdx = Math.floor(Math.random() * n);
    const desired = norm(-Math.PI/2 - (winIdx + .5) * seg);
    let delta = norm(desired - norm(rotation));
    if(delta < .2) delta += TAU;                       // 避免停在原地
    const turns = 5 + Math.floor(Math.random() * 4);   // 5~8 圈完整圈数
    const from = rotation, to = rotation + turns * TAU + delta;
    const dur = duration * 1000;
    const t0 = performance.now();
    let lastPtr = pointerIndex();

    function frame(t){
      const p = Math.min(1, (t - t0) / dur);
      rotation = from + (to - from) * easeOutQuint(p);
      const pi = pointerIndex();
      if(pi !== lastPtr){ lastPtr = pi; tickSound(); wigglePointer(); }
      if(p < 1) requestAnimationFrame(frame);
      else finishSpin(winIdx);
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(idx){
    rotation = norm(rotation);
    spinning = false;
    document.body.classList.remove('spinning');
    spinBtn.classList.remove('busy');
    spinBtn.querySelector('.t1').textContent = '开始';
    lastWin = idx;
    renderList();
    winSound();
    setTimeout(()=> showWinner(idx), 420);
  }

  function wigglePointer(){
    pointerEl.classList.remove('wiggle');
    void pointerEl.offsetWidth;
    pointerEl.classList.add('wiggle');
  }

  /* ================= 中奖弹层 ================= */

  function showWinner(idx){
    winName.textContent = items[idx];
    winSub.textContent = `编号 #${String(idx+1).padStart(2,'0')} · 共 ${items.length} 个选项`;
    $('#againBtn').style.display = items.length >= 2 ? '' : 'none';
    $('#removeWinBtn').style.display = items.length ? '' : 'none';
    winOverlay.classList.remove('hidden');
  }
  function hideWinner(){ winOverlay.classList.add('hidden'); }

  /* ================= 主循环 ================= */
  function loop(){
    drawWheel();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= 事件绑定 ================= */
  spinBtn.addEventListener('click', ()=>{ if(items.length < 2){ toast('请先在左侧添加至少 2 个选项', 'err'); return; } spin(); });

  $('#addBtn').addEventListener('click', commitAdd);
  addInput.addEventListener('keydown', e => { if(e.key === 'Enter') commitAdd(); });
  function commitAdd(){
    const v = addInput.value.trim();
    if(!v) return;
    addItems(parseMulti(v));
    addInput.value = '';
    addInput.focus();
  }

  /* 列表操作（事件委托） */
  itemList.addEventListener('click', e => {
    const li = e.target.closest('li'); if(!li || li.classList.contains('empty-row')) return;
    const idx = +li.dataset.idx;
    if(e.target.closest('.del')){
      const name = items[idx];
      li.style.transition = '.25s'; li.style.opacity = '0'; li.style.transform = 'translateX(-14px)';
      setTimeout(()=>{ items.splice(idx, 1); lastWin = -1; save(); renderList(); toast(`已删除「${name}」`); }, 200);
    } else if(e.target.closest('.edit')){
      startEdit(li, idx);
    }
  });
  itemList.addEventListener('dblclick', e => {
    const li = e.target.closest('li'); if(!li || li.classList.contains('empty-row')) return;
    if(e.target.closest('.name')) startEdit(li, +li.dataset.idx);
  });
  function startEdit(li, idx){
    if(li.querySelector('.edit-input')) return;
    const old = items[idx];
    const nameEl = li.querySelector('.name');
    nameEl.outerHTML = `<input class="edit-input" type="text" maxlength="24" value="${escapeHtml(old)}">`;
    const input = li.querySelector('.edit-input');
    li.querySelector('.row-actions').style.display = 'none';
    input.focus(); input.select();
    const finish = (commit)=>{
      const v = input.value.trim().slice(0, 24);
      if(commit && v && v !== old){
        if(items.some((x,i)=> x === v && i !== idx)){ toast('已存在同名项', 'err'); renderList(); return; }
        items[idx] = v; save(); toast('已修改', 'ok');
      }
      renderList();
    };
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter') finish(true);
      else if(e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', ()=> finish(true));
  }
  /* 悬停列表高亮扇区 */
  itemList.addEventListener('mouseover', e => { const li = e.target.closest('li'); hoverIdx = (li && !li.classList.contains('empty-row')) ? +li.dataset.idx : -1; });
  itemList.addEventListener('mouseleave', ()=> hoverIdx = -1);

  /* 打乱 */
  $('#shuffleBtn').addEventListener('click', ()=>{
    if(items.length < 2){ toast('没有可打乱的选项'); return; }
    for(let i = items.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
    lastWin = -1; save(); renderList(); toast('顺序已打乱', 'ok');
  });

  /* 清空（两步确认） */
  const clearBtn = $('#clearBtn');
  let clearArmed = false, clearTimer = null;
  clearBtn.addEventListener('click', ()=>{
    if(!items.length){ toast('列表已为空'); return; }
    if(!clearArmed){
      clearArmed = true; clearBtn.classList.add('arming');
      toast('再次点击确认清空全部', 'err');
      clearTimer = setTimeout(()=>{ clearArmed = false; clearBtn.classList.remove('arming'); }, 2600);
    } else {
      clearTimeout(clearTimer); clearArmed = false; clearBtn.classList.remove('arming');
      items = []; lastWin = -1; save(); renderList(); toast('已清空全部选项', 'ok');
    }
  });

  /* 批量导入 */
  $('#bulkBtn').addEventListener('click', ()=>{ bulkOverlay.classList.remove('hidden'); setTimeout(()=>bulkText.focus(), 60); });
  $('#bulkCancel').addEventListener('click', ()=> bulkOverlay.classList.add('hidden'));
  bulkOverlay.addEventListener('click', e => { if(e.target === bulkOverlay) bulkOverlay.classList.add('hidden'); });
  $('#bulkOk').addEventListener('click', ()=>{
    const list = parseMulti(bulkText.value);
    if(!list.length){ toast('请输入内容', 'err'); return; }
    addItems(list);
    bulkText.value = '';
    bulkOverlay.classList.add('hidden');
  });

  /* 中奖弹层按钮 */
  $('#closeWinBtn').addEventListener('click', hideWinner);
  $('#againBtn').addEventListener('click', ()=>{ hideWinner(); setTimeout(spin, 260); });
  $('#removeWinBtn').addEventListener('click', ()=>{
    const name = items[lastWin];
    if(lastWin >= 0 && lastWin < items.length){ items.splice(lastWin, 1); }
    lastWin = -1; save(); renderList(); hideWinner();
    toast(`已将「${name}」移出列表`, 'ok');
  });
  winOverlay.addEventListener('click', e => { if(e.target === winOverlay) hideWinner(); });

  /* 时长滑块 / 音效开关 / 全屏 */
  const durRange = $('#durRange'), durVal = $('#durVal');
  durRange.value = duration; durVal.textContent = duration + 's';
  durRange.addEventListener('input', ()=>{ duration = +durRange.value; durVal.textContent = duration + 's'; save(); });

  const soundBtn = $('#soundBtn');
  const svgSoundOn  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
  const svgSoundOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
  function renderSound(){ soundBtn.innerHTML = muted ? svgSoundOff : svgSoundOn; soundBtn.style.color = muted ? '' : 'var(--gold)'; }
  renderSound();
  soundBtn.addEventListener('click', ()=>{ muted = !muted; save(); renderSound(); if(!muted) beep(880, .08, 'triangle', .06, 0); });

  $('#fsBtn').addEventListener('click', ()=>{
    try{
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }catch(e){}
  });

  /* 空格快捷抽奖 */
  document.addEventListener('keydown', e => {
    if(e.code !== 'Space') return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    if(!winOverlay.classList.contains('hidden')){ hideWinner(); setTimeout(spin, 260); return; }
    if(!bulkOverlay.classList.contains('hidden')) return;
    spin();
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ hideWinner(); bulkOverlay.classList.add('hidden'); }
  });

  /* ================= 启动 ================= */
  load();
  durRange.value = duration; durVal.textContent = duration + 's';
  renderList();
})();
</script>
</body>
</html>
